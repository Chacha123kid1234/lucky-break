app = "lucky-break"
primary_region = "lhr"
[build]
  dockerfile = "Dockerfile"
[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/app/data"
  DEV_ADMIN = "0"
[[mounts]]
  source = "lucky_break_data"
  destination = "/app/data"
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    interval = "30s"
    timeout = "3s"
    method = "GET"
    path = "/health"
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
